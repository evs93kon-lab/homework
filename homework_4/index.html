<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<form class="form">
			<fieldset class="form-group">
				<legend class="form-group-title">Ваши личные данные</legend>
				<label for="name" class="lable">Ваше имя</label>
				<input
					id="name"
					class="input"
					type="text"
					placeholder="Имя"
					name="name"
					required
				/>
				<label for="age" class="lable">Ваш возраст</label>
				<input
					id="age"
					class="input"
					type="number"
					placeholder="Возраст"
					name="age"
					required
				/>
				<label for="phone" class="lable">Ваш возраст</label>
				<input
					id="phone"
					class="input"
					type="tel"
					inputmode="numeric"
					placeholder="Номер телефона"
					name="phone"
					required
				/>
				<label for="email" class="lable">Ваша почта</label>
				<input
					id="email"
					class="input"
					type="email"
					placeholder="Почта"
					name="email"
					required
				/>
			</fieldset>
			<fieldset class="form-group">
				<label for="massege" class="label">Сообщение</label>
				<textarea
					id="massege"
					class="textarea"
					placeholder="Ваше сообшщение"
					name="massege"
					required
				></textarea>
				<label class="lable">
					<input class="checkbox" type="checkbox" name="checkbox" required />
					<span class="checkbox-text">Я принимаю правила</span>
				</label>
			</fieldset>
			<button class="button">Отправить</button>
		</form>
	</body>
</html>
